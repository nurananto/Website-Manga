name: Backup D1 Database

on:
  schedule:
    - cron: '0 1 * * 0'   # Setiap Minggu 01:00 UTC (08:00 WIB)
  workflow_dispatch:        # bisa dipicu manual dari GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Export D1 ke SQL
        run: |
          DATE=$(date +%Y-%m-%d)
          wrangler d1 export manga-db --output=backup-${DATE}.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Upload backup sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: backup-*.sql
          retention-days: 30
