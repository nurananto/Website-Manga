name: Build Catalog

on:
  push:
    paths:
      - 'manga/**'
  schedule:
    - cron: '0 0 * * 0'   # Setiap Minggu jam 00:00 UTC (07:00 WIB)
  workflow_dispatch:        # bisa dipicu manual dari GitHub UI
    inputs:
      force_cover_resync:
        description: 'Download & upload ulang SEMUA cover (saat pindah bucket)'
        type: boolean
        default: false
      force_cover_slug:
        description: 'Force cover manga tertentu saja (slug, pisah koma). Contoh: Waka-chan'
        type: string
        default: ''
      mangalist_backfill:
        description: 'Kirim intro SEMUA manga ke #manga-list (sekali, untuk isi channel kosong)'
        type: boolean
        default: false

# GitHub kadang mengirim webhook `push` DUPLIKAT untuk 1 push yang sama
# (dibuktikan lewat API: 2 run dengan head_sha identik, jalan bersamaan —
# lihat kasus Chikasugiru Ch.12.2, 20 Agu 2026). Tanpa concurrency, 2 run
# itu checkout state repo yang SAMA (belum ada yang sempat commit-balik
# public/manga/*.json), jadi sama-sama mendeteksi chapter yang sama sebagai
# "baru" -> notifikasi Discord/Facebook terkirim 2x. cancel-in-progress:
# false supaya run kedua ANTRE (bukan dibatalkan) sampai run pertama commit
# balik — begitu run kedua mulai, dia lihat chapter itu sudah tercatat,
# tidak dianggap baru lagi.
concurrency:
  group: build-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # izin commit balik ke repo

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0    # perlu full history untuk git log (release_date)

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # --no-audit/--no-fund: skip audit endpoint yang lagi di-retire npm
      # (bikin notice + network round-trip ekstra yang bisa lambat).
      - name: Install cover sync dependencies
        run: npm install --no-save --no-audit --no-fund @aws-sdk/client-s3 sharp

      - name: Deteksi manga yang berubah di push ini
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "push" ] && git rev-parse --verify "${{ github.event.before }}" >/dev/null 2>&1; then
            SLUGS=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- manga/ | cut -d/ -f2 | sort -u | paste -sd, -)
          else
            SLUGS=""
          fi
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          echo "Manga berubah: ${SLUGS:-semua (full build)}"

      - name: Sync covers dari MangaDex ke R2
        run: node scripts/sync-covers.js
        env:
          CF_ACCOUNT_ID:       ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:    ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:      ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BUCKET_NAME: ${{ secrets.R2_PUBLIC_BUCKET_NAME }}
          FORCE_COVER_RESYNC:  ${{ inputs.force_cover_resync && '1' || '' }}
          FORCE_COVER_SLUG:    ${{ inputs.force_cover_slug }}
          # Hanya sync cover manga yang berubah di push ini (cron full build: kosong = semua)
          CHANGED_SLUGS:       ${{ steps.changed.outputs.slugs }}

      - name: Generate catalog.json
        run: node scripts/build-catalog.js
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_ADMIN_SECRET: ${{ secrets.WORKER_ADMIN_SECRET }}
          CHANGED_SLUGS: ${{ steps.changed.outputs.slugs }}
          CDN_BASE: ${{ secrets.CDN_BASE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MANGALIST_WEBHOOK_URL: ${{ secrets.DISCORD_MANGALIST_WEBHOOK_URL }}
          MANGALIST_BACKFILL: ${{ inputs.mangalist_backfill && '1' || '' }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          SITE_URL: https://nuranantoscans.my.id
          # R2 privat — ambil Image01.webp chapter LOCKED untuk notifikasi (upload byte)
          CF_ACCOUNT_ID:        ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BUCKET_NAME: ${{ secrets.R2_PUBLIC_BUCKET_NAME }}
          R2_LOCKED_BUCKET_NAME: ${{ secrets.R2_LOCKED_BUCKET_NAME }}

      - name: Generate version file
        run: |
          echo "{\"v\":\"$(date +%s)\",\"label\":\"$(date +'%-d %b %Y')\",\"type\":\"catalog\"}" > public/version.json

      - name: Commit hasil build
        # Retry push dengan rebase — Worker cron (sync view count, lihat
        # handleCron di worker/api-worker.js) commit LANGSUNG ke GitHub API
        # ke file manga/*/meta.json yang SAMA, independen dari job ini. Kalau
        # keduanya kebetulan nyaris bersamaan, push pertama bisa ditolak
        # (non-fast-forward). Sebelumnya cuma "git pull --rebase || true"
        # lalu 1x git push tanpa retry — kalau masih gagal setelah rebase,
        # job ini mati begitu saja dan step deploy di bawah IKUT TIDAK JALAN,
        # padahal build/sync-nya sendiri sudah sukses. Loop ini meniru pola
        # retry-dgn-HEAD-terbaru yang sudah dipakai Worker (commitGitHubTree).
        # Rebase yang KONFLIK BENERAN (bukan cuma "ketinggalan commit") tidak
        # bisa di-auto-resolve di sini — di-abort lalu digagalkan eksplisit
        # (exit 1) supaya job merah dengan pesan jelas, bukan gagal senyap.
        #
        # KECUALI public/version.json: isinya cuma timestamp yang di-generate
        # ULANG setiap run (lihat step "Generate version file" di atas) —
        # SELALU nulis baris yang sama, jadi kalau 2 run/push nyaris bersamaan
        # (sering kejadian pas lagi banyak push beruntun), baris itu HAMPIR
        # PASTI konflik tiap retry, walau bukan data yang perlu dipertahankan
        # dua-duanya ("siapa pun menang duluan" itu aman — cuma sinyal "ada
        # versi baru" buat poll App.jsx, bukan data manga). Kalau KONFLIKNYA
        # CUMA di file ini, regenerate timestamp baru & lanjut rebase alih-alih
        # abort — file lain (meta.json dkk) tetap diperlakukan strict.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # git rebase --continue bisa buka editor buat commit message tiap
          # commit yang di-replay — di CI non-interaktif itu bakal nge-hang.
          export GIT_EDITOR=true

          git add manga/ public/manga/ public/version.json

          if git diff --staged --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
            exit 0
          fi
          git commit -m "chore: sync covers & update catalog"

          max_attempts=5
          attempt=1
          while true; do
            if git push; then
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Gagal push setelah $max_attempts percobaan (kemungkinan konflik nyata di meta.json, bukan cuma ketinggalan commit)."
              exit 1
            fi
            echo "Push ditolak — percobaan $attempt/$max_attempts, rebase ulang ke HEAD terbaru..."
            git fetch origin main
            if ! git rebase origin/main; then
              conflicted=$(git diff --name-only --diff-filter=U)
              if [ "$conflicted" = "public/version.json" ]; then
                echo "Konflik cuma di public/version.json (timestamp) — regenerate & lanjut rebase, bukan abort."
                echo "{\"v\":\"$(date +%s)\",\"label\":\"$(date +'%-d %b %Y')\",\"type\":\"catalog\"}" > public/version.json
                git add public/version.json
                if git rebase --continue; then
                  attempt=$((attempt + 1))
                  continue
                fi
                echo "::error::git rebase --continue tetap gagal walau version.json sudah di-resolve — ada masalah lain."
              fi
              echo "::error::Rebase konflik saat percobaan $attempt — kemungkinan dua proses menulis baris yang sama persis di meta.json."
              git rebase --abort || true
              attempt=$((attempt + 1))
              sleep $((attempt * 3))
              continue
            fi
            attempt=$((attempt + 1))
          done

      # ── Deploy Direct Upload (commit bot tidak men-trigger deploy-pages.yml) ──
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build website
        run: npm run build
        env:
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
          VITE_IMAGE_URL: ${{ secrets.VITE_IMAGE_URL }}
          VITE_CDN_URL: ${{ secrets.VITE_CDN_URL }}
          VITE_TURNSTILE_SITEKEY: ${{ secrets.VITE_TURNSTILE_SITEKEY }}

      - name: Set version.json type catalog (refresh halus tanpa reload)
        # v = hash KODE (dipertahankan write-version.cjs) supaya deploy katalog TIDAK
        # menimpa sinyal update kode; hanya stempel `catalog` yang di-bump.
        run: VERSION_TYPE=catalog node scripts/write-version.cjs

      - name: Pastikan project Pages ada (idempotent)
        run: npx wrangler pages project create nuranantoscans --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy ke Cloudflare Pages (Direct Upload)
        run: npx wrangler pages deploy dist --project-name=nuranantoscans --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # Cache Rules di zone Cloudflare (di depan Pages) bisa menahan HTML/JSON lama
      # walau header origin sudah no-cache. Purge di sini memastikan pembaca dapat
      # katalog terbaru segera setelah deploy, tanpa perlu clear cache browser.
      - name: Purge Cloudflare cache
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ]; then
            echo "CF_ZONE_ID belum diset, lewati purge cache."
            exit 0
          fi
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
