name: Deploy Pages

# Deploy Direct Upload — tidak memakan kuota 500 build/bulan Cloudflare Pages.
# Trigger: push kode oleh manusia. Commit bot dari build-catalog TIDAK memicu
# workflow ini (GitHub tidak men-trigger workflow dari commit GITHUB_TOKEN),
# karena itu build-catalog.yml punya langkah deploy sendiri.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'manga/**'        # perubahan data manga ditangani build-catalog.yml
      - '.github/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # --no-audit: skip audit endpoint yang lagi di-retire npm (bikin
      # notice + network round-trip ekstra yang bisa lambat), --no-fund:
      # skip cek funding. Keamanan dependency tetap dicek terpisah (Dependabot).
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
          VITE_IMAGE_URL: ${{ secrets.VITE_IMAGE_URL }}
          VITE_CDN_URL: ${{ secrets.VITE_CDN_URL }}
          VITE_TURNSTILE_SITEKEY: ${{ secrets.VITE_TURNSTILE_SITEKEY }}

      # Sebelumnya cek dulu via "wrangler pages project list" + grep nama
      # project sebelum create — ternyata rapuh: grep bisa gak match kalau
      # output list dipaging/terpotong, jadi tetap nyoba create walau project
      # sudah ada (lihat run yang gagal dengan "A project with this name
      # already exists"). Sekarang langsung coba create & telan error "sudah
      # ada" — lebih cepat (skip 1 panggilan npx list) dan gak rapuh lagi.
      - name: Pastikan project Pages ada (idempotent)
        run: npx wrangler pages project create nuranantoscans --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy ke Cloudflare Pages (Direct Upload)
        run: npx wrangler pages deploy dist --project-name=nuranantoscans --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # Cache Rules di zone Cloudflare (di depan Pages) bisa menahan HTML/JS lama
      # walau header origin sudah no-cache. Purge di sini memastikan pembaca dapat
      # bundle terbaru segera setelah deploy, tanpa perlu clear cache browser.
      - name: Purge Cloudflare cache
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ]; then
            echo "CF_ZONE_ID belum diset, lewati purge cache."
            exit 0
          fi
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
