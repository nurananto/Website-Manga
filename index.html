<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Nurananto Scanlation</title>
    <!-- Preload catalog JSON agar LCP cepat -->
    <link rel="preload" href="/manga/index.json" as="fetch" crossorigin="anonymous" />
    <!-- Fonts are self-hosted via @fontsource (bundled with app, no external dependency) -->
    <!-- Anti-inspect ringan: hambat pembukaan DevTools (penghalang kasual, bukan keamanan) -->
    <script>
      (function () {
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return;
        var loop = function () {
          var t0 = performance.now();
          // eslint-disable-next-line no-debugger
          debugger;
          if (performance.now() - t0 > 100) {
            // DevTools terbuka → arahkan keluar
            document.body && (document.body.innerHTML = '');
            location.replace('about:blank');
          }
        };
        setInterval(loop, 1000);
      })();
    </script>
  </head>
  <body class="bg-surface text-on-surface" oncontextmenu="return false" ondragstart="return false" onselectstart="return false">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
