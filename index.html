<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MangaFlow - Premium Cinematic Reading</title>
    <!-- Preload catalog JSON agar LCP cepat -->
    <link rel="preload" href="/manga/index.json" as="fetch" crossorigin="anonymous" />
    <!-- Google Fonts — preconnect + non-render-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Hanken+Grotesk:wght@300;400;700&family=Geist:wght@500&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Hanken+Grotesk:wght@300;400;700&family=Geist:wght@500&display=swap" rel="stylesheet"/></noscript>
    <!-- Material Symbols — defer load -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/></noscript>
  </head>
  <body class="bg-surface text-on-surface" oncontextmenu="return false" ondragstart="return false" onselectstart="return false">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
