<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="description" content="nurananto scanslation" />
    <link rel="canonical" href="https://nuranantoscans.my.id/" />
    <title>Nurananto Scanlation</title>
    <!-- Open Graph / preview saat link dibagikan (WA, FB, Twitter, dll) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nurananto Scanlation" />
    <meta property="og:title" content="Nurananto Scanlation" />
    <meta property="og:description" content="nurananto scanslation" />
    <meta property="og:url" content="https://nuranantoscans.my.id/" />
    <meta property="og:image" content="https://nuranantoscans.my.id/logo-header.webp" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Nurananto Scanlation" />
    <meta name="twitter:description" content="nurananto scanslation" />
    <!-- Preconnect ke origin gambar & API agar koneksi siap lebih awal (hemat LCP) -->
    <link rel="preconnect" href="https://cdn.nuranantoscans.my.id" crossorigin />
    <link rel="preconnect" href="https://images.nuranantoscans.my.id" crossorigin />
    <link rel="preconnect" href="https://api.nuranantoscans.my.id" />
    <!-- Turnstile (verifikasi sebelum ambil token chapter terkunci) -->
    <link rel="preconnect" href="https://challenges.cloudflare.com" />
    <!-- Prefetch data JSON halaman ini SEDINI mungkin — sebelum bundle JS di-download,
         di-parse, dieksekusi, dan React mount+useEffect jalan. Tanpa ini, URL gambar
         LCP (hero cover) baru diketahui browser setelah seluruh rangkaian itu selesai,
         menyebabkan LCP molor beberapa detik terutama di koneksi lambat. App.jsx
         memakai window.__PREFETCH__ ini (kalau ada & cocok) ketimbang fetch ulang. -->
    <script>
      (function () {
        try {
          var parts = location.pathname.replace(/^\//, '').split('/').filter(Boolean);
          var RESERVED = ['history', 'auth'];
          var url = null, slug = null;
          if (parts.length === 0) {
            url = '/manga/index.json';
          } else if (!(parts.length === 1 && RESERVED.indexOf(parts[0]) !== -1)) {
            slug = parts[0];
            url = '/manga/' + slug + '.json';
          }
          if (url) {
            window.__PREFETCH__ = {
              type: slug ? 'manga' : 'index',
              slug: slug,
              promise: fetch(url, { cache: 'no-cache' })
                .then(function (r) { return r.ok ? r.json() : null; })
                .catch(function () { return null; }),
            };
          }
        } catch (e) {}
      })();
    </script>
    <!-- Fonts are self-hosted via @fontsource (bundled with app, no external dependency) -->
    <script>
      window.addEventListener('error', function (event) {
        var target = event.target;
        if (!target || target.tagName !== 'SCRIPT' || target.type !== 'module') return;
        if (!target.src || target.src.indexOf('/assets/') === -1) return;
        var key = 'mf-module-reload';
        try {
          if (sessionStorage.getItem(key)) return;
          sessionStorage.setItem(key, '1');
        } catch (e) {}
        var next = new URL(window.location.href);
        next.searchParams.set('r', Date.now().toString());
        window.location.replace(next.toString());
      }, true);
    </script>
  </head>
  <body class="bg-surface text-on-surface" oncontextmenu="return false" ondragstart="return false" onselectstart="return false">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
